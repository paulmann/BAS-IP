<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BAS-IP">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- barrier post -->
  <rect x="14" y="34" width="8" height="18" rx="2" fill="#a1a1aa"/>
  <!-- barrier arm, raised -->
  <g transform="rotate(-42 18 36)">
    <rect x="18" y="33" width="34" height="6" rx="3" fill="url(#b)"/>
    <rect x="26" y="33" width="4" height="6" fill="#18181b" opacity=".55"/>
    <rect x="36" y="33" width="4" height="6" fill="#18181b" opacity=".55"/>
    <rect x="46" y="33" width="4" height="6" fill="#18181b" opacity=".55"/>
  </g>
  <!-- ground -->
  <rect x="10" y="52" width="44" height="3" rx="1.5" fill="#52525b"/>
  <!-- status dot -->
  <circle cx="18" cy="24" r="4" fill="#22c55e"/>
</svg>
